<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiForum - 现代微论坛</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: { colors: { primary: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca' } } } }
}
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  *{font-family:'Inter',system-ui,-apple-system,sans-serif}
  body{background:#f0f2f5}
  .fade-in{animation:fadeIn .2s ease-out}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .toast-in{animation:slideUp .3s ease-out}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .post-card:hover{box-shadow:0 4px 24px rgba(0,0,0,.08)}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
  .sidebar-link.active{background:#eef2ff;color:#4f46e5;font-weight:600}
  .skeleton{background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .streak-num{font-size:1.5rem;font-weight:700;line-height:1}
  .cal-month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .cal-head{font-size:11px;color:#9ca3af;font-weight:500;padding:4px 0}
  .cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:13px;cursor:default;transition:all .15s;position:relative;color:#1f2937}
  .cal-cell.checked{position:relative}
  .cal-cell.checked::before{content:'✓';position:absolute;top:0;left:0;font-size:10px;font-weight:900;color:#fff;background:#16a34a;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:6px 0 6px 0;line-height:1;z-index:2}
  .cal-cell.missed{cursor:pointer;position:relative}
  .cal-cell.missed::after{content:'补';position:absolute;font-size:20px;font-weight:700;color:rgba(239,68,68,.12);pointer-events:none;z-index:0}
  .cal-cell.missed:hover{transform:scale(1.15)}
  .cal-cell.missed:hover::after{color:rgba(239,68,68,.25)}
  .cal-cell.missed span{position:relative;z-index:1}
  .cal-cell.today{outline:2px solid #6366f1;outline-offset:1px;font-weight:700}
</style>
</head>
<body class="min-h-screen text-gray-800">

<!-- Topbar -->
<header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-200/60">
  <div class="max-w-7xl mx-auto flex items-center justify-between px-4 h-14">
    <div class="flex items-center gap-3">
      <button id="sidebarToggle" class="lg:hidden p-2 -ml-2 rounded-lg hover:bg-gray-100">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a href="#" onclick="location.reload()" class="flex items-center gap-2 font-bold text-xl text-primary-600">
        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l4.93-1.36C8.42 21.5 10.15 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.61 0-3.14-.39-4.48-1.07l-.32-.17-2.93.81.81-2.93-.17-.32C4.39 15.14 4 13.61 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8z"/></svg>
        MiForum
      </a>
    </div>
    <div class="hidden sm:flex flex-1 max-w-md mx-6">
      <div class="relative w-full">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="searchInput" type="text" placeholder="搜索话题..." class="w-full pl-10 pr-4 py-2 bg-gray-100 border-0 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-300 focus:bg-white transition">
      </div>
    </div>
    <div id="authArea" class="flex items-center gap-2"></div>
  </div>
</header>

<div id="sidebarOverlay" class="fixed inset-0 bg-black/30 z-30 hidden lg:hidden" onclick="toggleSidebar()"></div>

<div class="max-w-7xl mx-auto flex relative">
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed lg:sticky top-14 left-0 z-30 w-64 h-[calc(100vh-3.5rem)] bg-white border-r border-gray-200/60 overflow-y-auto -translate-x-full lg:translate-x-0 transition-transform flex-shrink-0">
    <nav class="p-4 space-y-1">
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 px-3">版块分类</p>
      <button onclick="filterCategory('all')" data-cat="all" class="sidebar-link active w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600 hover:bg-gray-50 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        全部话题
      </button>
      <button onclick="filterCategory('tech')" data-cat="tech" class="sidebar-link w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600 hover:bg-gray-50 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
        技术
      </button>
      <button onclick="filterCategory('life')" data-cat="life" class="sidebar-link w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600 hover:bg-gray-50 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
        生活
      </button>
      <button onclick="filterCategory('notice')" data-cat="notice" class="sidebar-link w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600 hover:bg-gray-50 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>
        公告
      </button>
    </nav>

    <!-- Check-in Card -->
    <div class="p-4">
      <div class="bg-gradient-to-br from-primary-500 to-primary-700 rounded-2xl p-4 text-white">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span class="font-semibold text-sm">每日签到</span>
          </div>
          <span id="pointsBadge" class="hidden text-xs bg-white/20 px-2 py-0.5 rounded-full">0 积分</span>
        </div>
        <div id="streakInfo" class="hidden flex gap-4 mb-3 text-center">
          <div class="flex-1"><div class="streak-num" id="streakCurrent">0</div><div class="text-xs text-white/60">连续签到</div></div>
          <div class="flex-1"><div class="streak-num" id="streakTotal">0</div><div class="text-xs text-white/60">累计签到</div></div>
        </div>
        <div id="checkinStatusText" class="hidden text-center text-sm text-white/80 mb-2"></div>
        <button onclick="showCheckinHistory()" class="w-full py-1.5 bg-white/10 hover:bg-white/20 text-white text-xs rounded-xl transition">查看签到日历</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="p-4">
      <div class="bg-gray-50 rounded-2xl p-4 space-y-3">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">社区统计</p>
        <div class="flex justify-between text-sm"><span class="text-gray-500">话题数</span><span id="statPosts" class="font-semibold">-</span></div>
        <div class="flex justify-between text-sm"><span class="text-gray-500">评论数</span><span id="statComments" class="font-semibold">-</span></div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 min-w-0 p-4 lg:p-6">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 id="pageTitle" class="text-xl font-bold text-gray-900">全部话题</h1>
        <p id="pageSub" class="text-sm text-gray-500 mt-0.5">欢迎来到社区，参与讨论吧</p>
      </div>
      <button onclick="showNewPostModal()" class="flex items-center gap-2 px-4 py-2.5 bg-primary-600 text-white text-sm font-medium rounded-xl hover:bg-primary-700 shadow-lg shadow-primary-600/20 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        发布新话题
      </button>
    </div>

    <div id="postSkeleton" class="space-y-3">
      <div class="bg-white rounded-xl border border-gray-100 p-5"><div class="flex gap-3"><div class="w-9 h-9 rounded-full skeleton flex-shrink-0"></div><div class="flex-1 space-y-2"><div class="h-4 w-24 skeleton rounded"></div><div class="h-5 w-3/4 skeleton rounded"></div><div class="h-4 w-full skeleton rounded"></div></div></div></div>
      <div class="bg-white rounded-xl border border-gray-100 p-5"><div class="flex gap-3"><div class="w-9 h-9 rounded-full skeleton flex-shrink-0"></div><div class="flex-1 space-y-2"><div class="h-4 w-24 skeleton rounded"></div><div class="h-5 w-3/4 skeleton rounded"></div><div class="h-4 w-full skeleton rounded"></div></div></div></div>
      <div class="bg-white rounded-xl border border-gray-100 p-5"><div class="flex gap-3"><div class="w-9 h-9 rounded-full skeleton flex-shrink-0"></div><div class="flex-1 space-y-2"><div class="h-4 w-24 skeleton rounded"></div><div class="h-5 w-3/4 skeleton rounded"></div><div class="h-4 w-full skeleton rounded"></div></div></div></div>
    </div>
    <div id="postList" class="space-y-3"></div>
    <div id="emptyState" class="hidden text-center py-20">
      <svg class="w-16 h-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
      <p class="text-gray-400">暂无话题，快来发布第一条吧</p>
    </div>
  </main>
</div>

<!-- Auth Modal -->
<div id="authModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-6 fade-in">
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-lg font-bold">欢迎</h2>
      <button onclick="hideAuthModal()" class="p-1 rounded-lg hover:bg-gray-100"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="flex mb-5 bg-gray-100 rounded-xl p-1">
      <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 py-2 text-sm font-medium rounded-lg bg-white text-gray-900 shadow-sm transition">登录</button>
      <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 py-2 text-sm font-medium rounded-lg text-gray-500 transition">注册</button>
    </div>
    <div id="loginForm" class="space-y-3">
      <div><label class="block text-xs font-medium text-gray-500 mb-1">邮箱</label><input id="loginEmail" type="email" placeholder="you@example.com" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-300 transition"></div>
      <div><label class="block text-xs font-medium text-gray-500 mb-1">密码</label><input id="loginPassword" type="password" placeholder="输入密码" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-300 transition"></div>
      <button onclick="doLogin()" class="w-full py-2.5 bg-primary-600 text-white text-sm font-semibold rounded-xl hover:bg-primary-700 transition">登录</button>
    </div>
    <div id="registerForm" class="space-y-3 hidden">
      <div><label class="block text-xs font-medium text-gray-500 mb-1">用户名</label><input id="regUsername" type="text" placeholder="你的昵称" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-300 transition"></div>
      <div><label class="block text-xs font-medium text-gray-500 mb-1">邮箱</label><input id="regEmail" type="email" placeholder="you@example.com" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-300 transition"></div>
      <div><label class="block text-xs font-medium text-gray-500 mb-1">密码</label><input id="regPassword" type="password" placeholder="至少 6 位" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-300 transition"></div>
      <button onclick="doRegister()" class="w-full py-2.5 bg-primary-600 text-white text-sm font-semibold rounded-xl hover:bg-primary-700 transition">注册</button>
    </div>
  </div>
</div>

<!-- New Post Modal -->
<div id="newPostModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 p-6 fade-in">
    <div class="flex items-center justify-between mb-6">
      <h2 id="newPostTitle" class="text-lg font-bold">发布新话题</h2>
      <button onclick="hideNewPostModal()" class="p-1 rounded-lg hover:bg-gray-100"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="space-y-4">
      <div><label class="block text-sm font-medium text-gray-700 mb-1">标题</label><input id="postTitle" type="text" placeholder="请输入话题标题" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-300 transition"></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">分类</label><select id="postCategory" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-300 transition bg-white"><option value="tech">技术</option><option value="life">生活</option><option value="notice">公告</option></select></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">正文</label><textarea id="postContent" rows="5" placeholder="分享你的想法..." class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-300 transition resize-none"></textarea></div>
      <!-- 图片上传 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">图片（可选，最多30张，每张10MB）</label>
        <div id="imageGrid" class="flex flex-wrap gap-2"></div>
        <div id="addImageBtn" onclick="document.getElementById('postImages').click()" class="w-20 h-20 border-2 border-dashed border-gray-200 rounded-lg flex items-center justify-center cursor-pointer hover:border-primary-300 transition mt-2">
          <svg class="w-8 h-8 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        </div>
        <input type="file" id="postImages" accept=".jpg,.jpeg,.png,.gif,.webp,.bmp" multiple class="hidden" onchange="handleImageSelect(this)">
        <p class="text-xs text-gray-400 mt-1">支持 JPG / PNG / GIF / WebP / BMP，单张最大 10MB</p>
      </div>
      <button id="submitPostBtn" onclick="doNewPost()" class="w-full py-2.5 bg-primary-600 text-white text-sm font-semibold rounded-xl hover:bg-primary-700 transition">发布话题</button>
    </div>
  </div>
</div>

<!-- Image Lightbox -->
<div id="lightbox" class="fixed inset-0 z-[55] hidden items-center justify-center bg-black/80 backdrop-blur-sm cursor-pointer" onclick="closeLightbox()">
  <button onclick="closeLightbox()" class="absolute top-4 right-4 p-2 text-white/70 hover:text-white transition"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
  <img id="lightboxImg" class="max-w-[90vw] max-h-[90vh] object-contain rounded-lg" onclick="event.stopPropagation()">
</div>

<div id="toastContainer" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] space-y-2"></div>

<!-- Check-in History Modal -->
<div id="checkinHistoryModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl mx-4 max-h-[90vh] flex flex-col fade-in">
    <div class="flex items-center justify-between p-5 border-b border-gray-100">
      <h2 class="text-lg font-bold">签到日历</h2>
      <button onclick="hideCheckinHistory()" class="p-1 rounded-lg hover:bg-gray-100"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="flex-1 overflow-y-auto p-5 space-y-5">
      <!-- Stats Row -->
      <div class="grid grid-cols-4 gap-3">
        <div class="bg-gray-50 rounded-xl p-3 text-center"><div class="streak-num text-primary-600" id="histCurrent">0</div><div class="text-xs text-gray-500 mt-1">连续签到</div></div>
        <div class="bg-gray-50 rounded-xl p-3 text-center"><div class="streak-num text-amber-500" id="histLongest">0</div><div class="text-xs text-gray-500 mt-1">最长连续</div></div>
        <div class="bg-gray-50 rounded-xl p-3 text-center"><div class="streak-num text-green-600" id="histTotal">0</div><div class="text-xs text-gray-500 mt-1">累计签到</div></div>
        <div class="bg-gray-50 rounded-xl p-3 text-center"><div class="streak-num text-gray-400" id="histMissed">0</div><div class="text-xs text-gray-500 mt-1">可补签</div></div>
      </div>

      <!-- Calendar -->
      <div>
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold text-gray-700">签到日历</h3>
          <div class="flex items-center gap-3 text-xs text-gray-400">
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>已签</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-red-200 inline-block"></span>未签</span>
          </div>
        </div>
        <!-- Month Navigation -->
        <div class="flex items-center justify-between mb-3">
          <button onclick="calPrev()" class="p-1.5 rounded-lg hover:bg-gray-100 transition">
            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          </button>
          <div class="flex items-center gap-2">
            <div class="relative">
              <button onclick="toggleMonthPicker()" id="calTitle" class="text-base font-bold text-gray-800 hover:text-primary-600 transition cursor-pointer px-3 py-1 rounded-lg hover:bg-gray-100 flex items-center gap-1"></button>
              <!-- Month Picker Dropdown -->
              <div id="monthPicker" class="hidden absolute top-full mt-2 bg-white rounded-xl shadow-xl border border-gray-100 p-3 z-10 fade-in" style="width:240px;left:50%;margin-left:-120px">
                <div class="grid grid-cols-3 gap-2" id="monthPickerGrid"></div>
              </div>
            </div>
            <button onclick="calToday()" class="text-xs px-2 py-1 rounded-lg bg-primary-50 text-primary-600 hover:bg-primary-100 font-medium transition">今天</button>
          </div>
          <button onclick="calNext()" class="p-1.5 rounded-lg hover:bg-gray-100 transition">
            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
        <!-- Month Grid -->
        <div class="bg-gray-50 rounded-2xl p-4 overflow-hidden">
          <div class="cal-month mb-2">
            <span class="cal-head">日</span><span class="cal-head">一</span><span class="cal-head">二</span><span class="cal-head">三</span><span class="cal-head">四</span><span class="cal-head">五</span><span class="cal-head">六</span>
          </div>
          <div id="calGrid" class="cal-month" style="transition:opacity .2s ease,transform .2s ease"></div>

      <!-- Retroactive -->

<div id="adminPanelModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 backdrop-blur-sm">

<script>
// ============================================================
// 配置常量
// ============================================================
const CAT_MAP = { all: '全部话题', tech: '技术', life: '生活', notice: '公告' };
const CAT_COLORS = { tech: 'bg-blue-100 text-blue-700', life: 'bg-pink-100 text-pink-700', notice: 'bg-amber-100 text-amber-700' };

// 全局状态
let state = { user: null, currentCat: 'all', posts: [], likedIds: new Set(), bookmarkedIds: new Set() };

// ============================================================
// 工具函数
// ============================================================

/** 显示 toast 提示（自动消失） */
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast-in px-4 py-2.5 bg-gray-900 text-white text-sm rounded-xl shadow-lg';
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2500);
}

/** ISO 时间 → 相对时间（X分钟前 / X小时前 / YYYY年M月D日） */
function relTime(iso) {
  const d = Date.now() - new Date(iso + (iso.includes('Z') || iso.includes('+') ? '' : 'Z')).getTime();
  const m = Math.floor(d / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + '分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + '小时前';
  const date = new Date(iso + (iso.includes('Z') || iso.includes('+') ? '' : 'Z'));
  return date.getFullYear() + '年' + (date.getMonth() + 1) + '月' + date.getDate() + '日';
}

/** HTML 转义（防 XSS） */
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/** 图片 Lightbox 弹窗 */
function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.remove('hidden');
  document.getElementById('lightbox').classList.add('flex');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.add('hidden');
  document.getElementById('lightbox').classList.remove('flex');
  document.body.style.overflow = '';
}

/** 通用 API 请求封装（JSON 格式） */
async function api(url, opts) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

// ============================================================
// Modal 控制
// ============================================================
function showAuthModal() { document.getElementById('authModal').classList.remove('hidden'); document.getElementById('authModal').classList.add('flex'); }
function hideAuthModal() { document.getElementById('authModal').classList.add('hidden'); document.getElementById('authModal').classList.remove('flex'); }
function showNewPostModal() { if (!state.user) { toast('请先登录'); showAuthModal(); return; } document.getElementById('newPostModal').classList.remove('hidden'); document.getElementById('newPostModal').classList.add('flex'); document.getElementById('postTitle').focus(); }
function hideNewPostModal() { document.getElementById('newPostModal').classList.add('hidden'); document.getElementById('newPostModal').classList.remove('flex'); }

/** 切换登录/注册 Tab */
function switchAuthTab(t) {
  document.getElementById('tabLogin').className = `flex-1 py-2 text-sm font-medium rounded-lg transition ${t === 'login' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'}`;
  document.getElementById('tabRegister').className = `flex-1 py-2 text-sm font-medium rounded-lg transition ${t === 'register' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'}`;
  document.getElementById('loginForm').classList.toggle('hidden', t !== 'login');
  document.getElementById('registerForm').classList.toggle('hidden', t !== 'register');
}

// ============================================================
// 用户认证
// ============================================================

/** 登录 */
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { toast('请填写邮箱和密码'); return; }
  try {
    const { user } = await api('/api/login', { method: 'POST', body: JSON.stringify({ email, password }) });
    state.user = user;
    hideAuthModal();
    renderAuth();
    await loadCheckin();
    await loadPosts();
    toast('登录成功！');
  } catch (e) { toast(e.message); }
}

/** 注册 */
async function doRegister() {
  const username = document.getElementById('regUsername').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  if (!username || !email || !password) { toast('请填写所有字段'); return; }
  if (password.length < 6) { toast('密码至少6位'); return; }
  try {
    const { user } = await api('/api/register', { method: 'POST', body: JSON.stringify({ username, email, password }) });
    state.user = user;
    hideAuthModal();
    renderAuth();
    await loadCheckin();
    await loadPosts();
    toast('注册成功！');
  } catch (e) { toast(e.message); }
}

/** 退出登录 */
async function doLogout() {
  await api('/api/logout', { method: 'POST' });
  state.user = null;
  state.likedIds.clear();
  renderAuth();
  renderCheckin(false);
  toast('已退出');
}

/** 渲染头像（有图片用 img，否则用首字母） */
function avatarHtml(url, letter, size) {
  if (url) return `<img src="${url}" class="${size} rounded-full object-cover cursor-pointer">`;
  return `<div class="${size} rounded-full bg-primary-100 text-primary-700 flex items-center justify-center text-sm font-bold cursor-pointer">${esc(letter)}</div>`;
}

/** 渲染右上角登录状态 */
function renderAuth() {
  const a = document.getElementById('authArea');
  let html = '';
  if (state.user) {
    const role = state.user.role || 'user';
    const isSuperAdmin = role === 'super_admin';
    const isAdmin = role === 'admin' || isSuperAdmin;
    const roleLabel = isSuperAdmin ? '超管' : isAdmin ? '管理' : '';
    const roleColor = isSuperAdmin ? 'bg-red-500' : isAdmin ? 'bg-amber-500' : '';

    html += `<div class="flex items-center gap-2">
      <a href="/profile.html?id=${state.user.id}" class="flex items-center gap-2 hover:opacity-80 transition">
        ${avatarHtml(state.user.avatar_url, state.user.username[0].toUpperCase(), 'w-8 h-8')}
        <span class="text-sm font-medium hidden sm:inline">${esc(state.user.username)}</span>
      </a>
      ${roleLabel ? `<span class="text-xs px-1.5 py-0.5 rounded ${roleColor} text-white">${roleLabel}</span>` : ''}
      ${state.user.muted ? '<span class="text-xs px-1.5 py-0.5 rounded bg-red-100 text-red-600">禁言中</span>' : ''}
      <button onclick="doLogout()" class="text-xs text-gray-400 hover:text-gray-600 ml-1">退出</button>
    </div>`;
    // 管理员入口
    if (isAdmin) {
      html += '<button onclick="showAdminPanel()" class="px-3 py-1.5 bg-amber-500 text-white text-sm font-medium rounded-xl hover:bg-amber-600 transition">管理</button>';
    }
  } else {
    html += '<button onclick="showAuthModal()" class="px-4 py-1.5 bg-primary-600 text-white text-sm font-medium rounded-xl hover:bg-primary-700 transition">登录 / 注册</button>';
  }
  a.innerHTML = html;
}

// ============================================================
// 签到系统
// ============================================================
let checkinData = null; // 缓存签到历史数据

/** 加载签到状态（自动签到 + 获取统计） */
async function loadCheckin() {
  if (!state.user) { renderCheckin(false); return; }
  // 自动签到
  try {
    const res = await api('/api/checkin/auto', { method: 'POST' });
    state.user.points = res.points;
    if (res.newCheckin) toast('每日签到成功！积分 +10');
    renderCheckin(res.checkedIn);
  } catch (e) { renderCheckin(false); }
  // 加载签到统计（连续天数、累计天数）
  try {
    checkinData = await api('/api/checkin/history');
    if (checkinData) {
      document.getElementById('streakCurrent').textContent = checkinData.currentStreak;
      document.getElementById('streakTotal').textContent = checkinData.totalDays;
      document.getElementById('streakInfo').classList.remove('hidden');
    }
  } catch (e) { checkinData = null; }
}

/** 渲染侧边栏签到状态 */
function renderCheckin(checked) {
  const badge = document.getElementById('pointsBadge');
  const statusText = document.getElementById('checkinStatusText');
  if (!state.user) { badge.classList.add('hidden'); statusText.classList.add('hidden'); return; }
  badge.textContent = state.user.points + ' 积分';
  badge.classList.remove('hidden');
  if (checked) { statusText.textContent = '✓ 今日已签到'; statusText.classList.remove('hidden'); }
  else { statusText.classList.add('hidden'); }
}

// ============================================================
// 签到日历弹窗
// ============================================================

/** 打开签到历史弹窗 */
function showCheckinHistory() {
  if (!state.user) { toast('请先登录'); showAuthModal(); return; }
  loadCheckinHistory();
  document.getElementById('checkinHistoryModal').classList.remove('hidden');
  document.getElementById('checkinHistoryModal').classList.add('flex');
}
function hideCheckinHistory() {
  document.getElementById('checkinHistoryModal').classList.add('hidden');
  document.getElementById('checkinHistoryModal').classList.remove('flex');
}

/** 加载签到历史数据并渲染日历 */
async function loadCheckinHistory() {
  if (!checkinData) {
    try { checkinData = await api('/api/checkin/history'); } catch (e) { toast('加载失败'); return; }
  }
  const d = checkinData;
  // 统计卡片
  document.getElementById('histCurrent').textContent = d.currentStreak;
  document.getElementById('histLongest').textContent = d.longestStreak;
  document.getElementById('histTotal').textContent = d.totalDays;
  document.getElementById('histMissed').textContent = d.missedDays.length;
  // 补签区域
  const retroSection = document.getElementById('retroSection');
  if (d.missedDays.length > 0) {
    retroSection.classList.remove('hidden');
    document.getElementById('retroPoints').textContent = d.points;
    document.getElementById('retroCanCount').textContent = Math.min(d.missedDays.length, Math.floor(d.points / 10));
  } else { retroSection.classList.add('hidden'); }
  renderCalendar(d);
}

// ===== 日历渲染 =====
let calYear, calMonth; // 当前显示的年月
let calCheckinSet, calMissedSet, calTodayStr;

/** 初始化日历数据 */
function renderCalendar(data) {
  calCheckinSet = new Set(data.checkinDates);
  calMissedSet = new Set(data.missedDays);
  calTodayStr = new Date().toLocaleDateString('sv-SE');
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  drawMonth();
}

/**
 * 绘制月历（带滑动动画）
 * @param {string|null} direction - 'left'/'right' 表示滑动方向，null 表示无动画
 */
function drawMonth(direction) {
  const grid = document.getElementById('calGrid');
  const title = document.getElementById('calTitle');
  title.innerHTML = `${calYear}年${calMonth + 1}月 <svg class="w-3.5 h-3.5 inline-block text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>`;

  if (direction) {
    grid.style.opacity = '0';
    grid.style.transform = direction === 'left' ? 'translateX(20px)' : 'translateX(-20px)';
    setTimeout(() => {
      renderGridCells(grid);
      grid.style.transform = direction === 'left' ? 'translateX(-20px)' : 'translateX(20px)';
      requestAnimationFrame(() => { grid.style.opacity = '1'; grid.style.transform = 'translateX(0)'; });
    }, 150);
  } else { renderGridCells(grid); }
}

/** 渲染 6×7 = 42 个日历格子（含上下月填充） */
function renderGridCells(grid) {
  const firstDay = new Date(calYear, calMonth, 1);
  const lastDay = new Date(calYear, calMonth + 1, 0);
  const startPad = firstDay.getDay(); // 本月1号是周几
  const totalDays = lastDay.getDate();
  const prevLast = new Date(calYear, calMonth, 0);
  const prevDays = prevLast.getDate();

  let html = '';
  for (let i = 0; i < 42; i++) {
    let d, y, m, isCurrent = true;

    // 上月填充
    if (i < startPad) {
      d = prevDays - startPad + 1 + i;
      y = calMonth === 0 ? calYear - 1 : calYear;
      m = calMonth === 0 ? 12 : calMonth;
      isCurrent = false;
    }
    // 下月填充
    else if (i >= startPad + totalDays) {
      d = i - startPad - totalDays + 1;
      y = calMonth === 11 ? calYear + 1 : calYear;
      m = calMonth === 11 ? 1 : calMonth + 2;
      isCurrent = false;
    }
    // 本月日期
    else {
      d = i - startPad + 1;
      y = calYear;
      m = calMonth + 1;
    }

    const ds = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

    // 非本月：浅灰色
    if (!isCurrent) { html += `<div class="cal-cell" style="color:#d1d5db">${d}</div>`; continue; }

    let cls = 'cal-cell';
    let clickable = '';

    if (ds > calTodayStr) { /* 未来日期：默认样式 */ }
    else if (calCheckinSet.has(ds)) { cls += ' checked'; } // 已签到：绿色三角✓
    else if (calMissedSet.has(ds)) { cls += ' missed'; clickable = ` onclick="doRetroactive('${ds}')" title="点击补签"`; } // 可补签：红色「补」字
    if (ds === calTodayStr) cls += ' today'; // 今天：紫色边框

    // missed 的数字用 span 包裹，保证在「补」字上层
    const content = cls.includes('missed') ? `<span>${d}</span>` : d;
    html += `<div class="${cls}"${clickable}>${content}</div>`;
  }
  grid.innerHTML = html;
}

// 月份翻页
function calPrev() { closeMonthPicker(); calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } drawMonth('right'); }
function calNext() { closeMonthPicker(); calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } drawMonth('left'); }
function calToday() { closeMonthPicker(); const now = new Date(); const old = calMonth; calYear = now.getFullYear(); calMonth = now.getMonth(); drawMonth(calMonth > old ? 'left' : calMonth < old ? 'right' : null); }

// 月份选择器弹窗
function toggleMonthPicker() {
  const picker = document.getElementById('monthPicker');
  if (!picker.classList.contains('hidden')) { closeMonthPicker(); return; }
  const grid = document.getElementById('monthPickerGrid');
  const names = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  grid.innerHTML = names.map((n, i) => `<button onclick="selectMonth(${i})" class="py-2 text-sm rounded-lg transition ${i === calMonth ? 'bg-primary-600 text-white font-semibold' : 'text-gray-600 hover:bg-gray-100'}">${n}</button>`).join('');
  picker.classList.remove('hidden');
}
function selectMonth(m) { const old = calMonth; calMonth = m; closeMonthPicker(); drawMonth(m > old ? 'left' : m < old ? 'right' : null); }
function closeMonthPicker() { document.getElementById('monthPicker').classList.add('hidden'); }

// 点击外部关闭月份选择器
document.addEventListener('click', (e) => {
  const picker = document.getElementById('monthPicker');
  const title = document.getElementById('calTitle');
  if (picker && !picker.contains(e.target) && !title.contains(e.target)) closeMonthPicker();
});

/** 补签操作 */
async function doRetroactive(date) {
  if (!confirm(`确认补签 ${date}？\n消耗 10 积分`)) return;
  try {
    const res = await api('/api/checkin/retroactive', { method: 'POST', body: JSON.stringify({ date }) });
    state.user.points = res.points;
    checkinData = null; // 清除缓存
    await loadCheckinHistory();
    await loadCheckin();
    toast(`补签成功！${date}，剩余 ${res.points} 积分`);
  } catch (e) { toast(e.message); }
}

// ============================================================
// 帖子列表
// ============================================================
let selectedImages = []; // 新帖选中的图片文件

/** 加载帖子列表 */
async function loadPosts() {
  const params = new URLSearchParams();
  if (state.currentCat !== 'all') params.set('category', state.currentCat);
  const { posts } = await api('/api/posts?' + params);
  state.posts = posts;
  // 加载当前用户的点赞和收藏状态
  if (state.user) {
    const [{ ids }, bookmarks] = await Promise.all([api('/api/likes'), api('/api/bookmarks').catch(() => ({ posts: [] }))]);
    state.likedIds = new Set(ids);
    state.bookmarkedIds = new Set((bookmarks.posts || []).map(p => p.id));
  } else {
    state.likedIds = new Set();
    state.bookmarkedIds = new Set();
  }
  document.getElementById('postSkeleton').classList.add('hidden');
  renderPosts();
}

/** 渲染帖子列表 */
function renderPosts() {
  const list = document.getElementById('postList'), empty = document.getElementById('emptyState');
  if (!state.posts.length) { list.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');

  list.innerHTML = state.posts.map(p => {
    const liked = state.likedIds.has(p.id);
    const hasImgs = p.images && p.images.length > 0;
    const firstImg = hasImgs ? p.images[0] : null;
    const userRole = state.user ? (state.user.role || 'user') : 'user';
    const isAdmin = userRole === 'admin' || userRole === 'super_admin';
    return `<div class="post-card bg-white rounded-xl border border-gray-100 p-4 sm:p-5 cursor-pointer transition hover:border-gray-200" onclick="window.open('/post.html?id=${p.id}','_blank')">
      <div class="flex items-start gap-3">
        <a href="/profile.html?id=${p.author_id}" onclick="event.stopPropagation()" class="flex-shrink-0">${avatarHtml(p.author_avatar_url, p.author_name[0].toUpperCase(), 'w-9 h-9')}</a>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1 flex-wrap">
            <span class="text-sm font-semibold text-gray-900">${esc(p.author_name)}</span>
            <span class="text-xs text-gray-400">${relTime(p.created_at)}</span>
            <span class="text-xs px-2 py-0.5 rounded-full ${CAT_COLORS[p.category] || 'bg-gray-100 text-gray-600'}">${CAT_MAP[p.category]}</span>
            ${p.updated_at ? '<span class="text-xs text-gray-400">(已编辑)</span>' : ''}
            ${hasImgs && p.images.length > 1 ? `<span class="text-xs text-gray-400">📷${p.images.length}</span>` : ''}
            ${p.pinned ? '<span class="text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">置顶</span>' : ''}
            ${isAdmin ? `<span class="ml-auto flex items-center gap-1"><button onclick="event.stopPropagation();togglePinPost(${p.id},${!!p.pinned})" class="text-xs px-2 py-0.5 rounded-lg ${p.pinned ? 'bg-amber-100 text-amber-700' : 'bg-gray-100 text-gray-500'} hover:bg-amber-200 transition">${p.pinned ? '取消置顶' : '置顶'}</button><button onclick="event.stopPropagation();adminDeletePost(${p.id})" class="text-xs px-2 py-0.5 rounded-lg bg-red-50 text-red-500 hover:bg-red-100 transition">删除</button></span>` : ''}
          </div>
          <h3 class="text-base font-semibold text-gray-900 mb-1 line-clamp-1">${esc(p.title)}</h3>
          <p class="text-sm text-gray-500 line-clamp-2">${esc(p.content).replace(/\n/g, ' ')}</p>
          ${firstImg ? `<img src="${firstImg}" class="mt-2 rounded-lg max-h-24 object-cover" onclick="event.stopPropagation();openLightbox('${firstImg}')">` : ''}
          <div class="flex items-center gap-4 mt-3">
            <button onclick="event.stopPropagation();toggleLike(${p.id})" class="flex items-center gap-1 text-xs ${liked ? 'text-red-500' : 'text-gray-400'} hover:text-red-500 transition">
              <svg class="w-4 h-4" fill="${liked ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
              ${p.likes_count || 0}
            </button>
            <span class="flex items-center gap-1 text-xs text-gray-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
              ${p.comments_count || 0}
            </span>
            <button onclick="event.stopPropagation();toggleBookmark(${p.id})" class="flex items-center gap-1 text-xs ${state.bookmarkedIds.has(p.id) ? 'text-yellow-500' : 'text-gray-400'} hover:text-yellow-500 transition" title="收藏">
              <svg class="w-4 h-4" fill="${state.bookmarkedIds.has(p.id) ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  // 更新侧边栏统计
  document.getElementById('statPosts').textContent = state.posts.length;
  document.getElementById('statComments').textContent = state.posts.reduce((s, p) => s + p.comments_count, 0);
}

/** 选择图片文件（新帖） */
function handleImageSelect(input) {
  const files = Array.from(input.files);
  if (selectedImages.length + files.length > 30) { toast('最多上传30张图片'); input.value = ''; return; }
  for (const f of files) {
    if (f.size > 10 * 1024 * 1024) { toast(`"${f.name}" 超过10MB`); continue; }
    selectedImages.push(f);
  }
  renderSelectedImages();
  input.value = '';
}

/** 渲染已选图片预览 */
function renderSelectedImages() {
  const grid = document.getElementById('imageGrid');
  const btn = document.getElementById('addImageBtn');
  grid.innerHTML = selectedImages.map((f, i) => {
    const url = URL.createObjectURL(f);
    return `<div class="relative w-20 h-20 rounded-lg overflow-hidden group">
      <img src="${url}" class="w-full h-full object-cover">
      <button onclick="removeSelectedImage(${i})" class="absolute top-0 right-0 w-5 h-5 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
        <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>`;
  }).join('');
  btn.style.display = selectedImages.length >= 30 ? 'none' : 'flex';
}

function removeSelectedImage(i) { selectedImages.splice(i, 1); renderSelectedImages(); }

/** 重置发帖表单 */
function resetPostForm() {
  document.getElementById('postTitle').value = '';
  document.getElementById('postContent').value = '';
  document.getElementById('postCategory').value = 'tech';
  selectedImages = [];
  renderSelectedImages();
  document.getElementById('newPostTitle').textContent = '发布新话题';
}

/** 提交新帖子（FormData 上传图片） */
async function doNewPost() {
  const title = document.getElementById('postTitle').value.trim();
  const cat = document.getElementById('postCategory').value;
  const content = document.getElementById('postContent').value.trim();
  if (!title) { toast('请输入标题'); return; }
  if (!content) { toast('请输入正文'); return; }
  const btn = document.getElementById('submitPostBtn'); btn.disabled = true; btn.textContent = '发布中...';
  try {
    const formData = new FormData();
    formData.append('title', title);
    formData.append('content', content);
    formData.append('category', cat);
    selectedImages.forEach(f => formData.append('images', f));

    const res = await fetch('/api/posts', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '发布失败');

    hideNewPostModal();
    resetPostForm();
    if (data.points) state.user.points = data.points;
    renderCheckin(false);
    if (state.currentCat !== 'all' && state.currentCat !== cat) filterCategory('all');
    else await loadPosts();
    toast('发布成功！积分 +5');
  } catch (e) { toast(e.message); }
  finally { btn.disabled = false; btn.textContent = '发布话题'; }
}

/** 点赞/取消点赞 */
async function toggleLike(pid) {
  if (!state.user) { toast('请先登录'); showAuthModal(); return; }
  try {
    if (state.likedIds.has(pid)) { await api('/api/like/' + pid, { method: 'DELETE' }); state.likedIds.delete(pid); }
    else { await api('/api/like/' + pid, { method: 'POST' }); state.likedIds.add(pid); }
    await loadPosts();
  } catch (e) { toast(e.message); }
}

/** 收藏/取消收藏帖子 */
async function toggleBookmark(pid) {
  if (!state.user) { toast('请先登录'); showAuthModal(); return; }
  try {
    if (state.bookmarkedIds.has(pid)) {
      await api('/api/bookmark/' + pid, { method: 'DELETE' });
      state.bookmarkedIds.delete(pid);
      toast('已取消收藏');
    } else {
      await api('/api/bookmark/' + pid, { method: 'POST' });
      state.bookmarkedIds.add(pid);
      toast('收藏成功');
    }
    renderPosts();
  } catch (e) { toast(e.message); }
}

// ============================================================
// 分类筛选 / 搜索
// ============================================================
function filterCategory(cat) {
  state.currentCat = cat;
  document.querySelectorAll('.sidebar-link').forEach(el => el.classList.toggle('active', el.dataset.cat === cat));
  document.getElementById('pageTitle').textContent = CAT_MAP[cat];
  document.getElementById('pageSub').textContent = '欢迎来到社区，参与讨论吧';
  loadPosts();
  if (window.innerWidth < 1024) toggleSidebar();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('-translate-x-full');
  document.getElementById('sidebarOverlay').classList.toggle('hidden');
}

// 搜索（300ms 防抖）
let searchTimer = null;
document.getElementById('searchInput').addEventListener('input', function (e) {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  searchTimer = setTimeout(async () => {
    if (!q) {
      document.getElementById('pageTitle').textContent = CAT_MAP[state.currentCat];
      document.getElementById('pageSub').textContent = '欢迎来到社区，参与讨论吧';
      await loadPosts();
      return;
    }
    const { posts } = await api('/api/posts?' + new URLSearchParams({ search: q }));
    state.posts = posts;
    document.getElementById('postSkeleton').classList.add('hidden');
    document.getElementById('pageTitle').textContent = '搜索: ' + q;
    document.getElementById('pageSub').textContent = '找到 ' + posts.length + ' 条结果';
    renderPosts();
  }, 300);
});

// ============================================================
// 事件绑定
// ============================================================
document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);
// 点击 Modal 背景关闭
document.querySelectorAll('[id$="Modal"]').forEach(m => {
  m.addEventListener('click', function (e) { if (e.target === this) { this.classList.add('hidden'); this.classList.remove('flex'); } });
});
// Enter 键提交
document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('regPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });

// ============================================================
// 管理员功能
// ============================================================
let adminUsersCache = [];

/** 打开管理面板 */
function showAdminPanel() {
  loadAdminUsers();
  document.getElementById('adminPanelModal').classList.remove('hidden');
  document.getElementById('adminPanelModal').classList.add('flex');
  // 显示角色标签
  const badge = document.getElementById('adminRoleBadge');
  if (state.user && state.user.role === 'super_admin') {
    badge.textContent = '超级管理员';
    badge.className = 'text-xs px-2 py-0.5 rounded-full bg-red-500 text-white';
  } else {
    badge.textContent = '管理员';
    badge.className = 'text-xs px-2 py-0.5 rounded-full bg-amber-500 text-white';
  }
}
function hideAdminPanel() {
  document.getElementById('adminPanelModal').classList.add('hidden');
  document.getElementById('adminPanelModal').classList.remove('flex');
}

/** 加载用户列表 */
async function loadAdminUsers() {
  try {
    const { users } = await api('/api/admin/users');
    adminUsersCache = users;
    renderAdminUsers(users);
  } catch (e) { toast(e.message); }
}

/** 渲染用户列表 */
function renderAdminUsers(users) {
  const list = document.getElementById('adminUserList');
  const currentRole = state.user ? (state.user.role || 'user') : 'user';
  const isSuperAdmin = currentRole === 'super_admin';

  if (!users.length) { list.innerHTML = '<p class="text-sm text-gray-400 text-center py-8">暂无用户</p>'; return; }

  list.innerHTML = users.map(u => {
    const role = u.role || 'user';
    const roleLabel = role === 'super_admin' ? '超管' : role === 'admin' ? '管理' : '';
    const roleColor = role === 'super_admin' ? 'bg-red-500' : role === 'admin' ? 'bg-amber-500' : '';
    const isSuperAdminUser = role === 'super_admin';
    const isAdminUser = role === 'admin';

    return `
    <div class="flex items-center gap-3 bg-gray-50 rounded-xl p-3">
      <a href="/profile.html?id=${u.id}" class="flex-shrink-0">${avatarHtml(u.avatar_url, u.username[0].toUpperCase(), 'w-9 h-9')}</a>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-sm font-semibold text-gray-900">${esc(u.username)}</span>
          ${roleLabel ? `<span class="text-xs px-1.5 py-0.5 rounded ${roleColor} text-white">${roleLabel}</span>` : ''}
          ${u.muted ? '<span class="text-xs px-1.5 py-0.5 rounded bg-red-100 text-red-600">已禁言</span>' : ''}
        </div>
        <div class="text-xs text-gray-400 truncate">${esc(u.email)} · ${u.points} 积分 · ${u.posts_count} 帖 · ${u.comments_count} 评论</div>
      </div>
      <div class="flex items-center gap-1.5 flex-shrink-0 flex-wrap justify-end">
        ${isSuperAdmin && !isSuperAdminUser ? `
          ${isAdminUser
            ? `<button onclick="revokeAdmin(${u.id})" class="text-xs px-2 py-1 rounded-lg bg-amber-50 text-amber-600 hover:bg-amber-100 transition">撤销管理</button>`
            : `<button onclick="grantAdmin(${u.id})" class="text-xs px-2 py-1 rounded-lg bg-amber-500 text-white hover:bg-amber-600 transition">设为管理</button>`
          }
          <button onclick="transferSuperAdmin(${u.id})" class="text-xs px-2 py-1 rounded-lg bg-red-50 text-red-500 hover:bg-red-100 transition">转让超管</button>
        ` : ''}
        ${!isSuperAdminUser ? `
          <button onclick="toggleMute(${u.id})" class="text-xs px-2 py-1 rounded-lg ${u.muted ? 'bg-green-50 text-green-600 hover:bg-green-100' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'} transition">${u.muted ? '解禁' : '禁言'}</button>
          <button onclick="adminDeleteUser(${u.id})" class="text-xs px-2 py-1 rounded-lg bg-gray-100 text-gray-500 hover:bg-red-50 hover:text-red-500 transition">删除</button>
        ` : ''}
      </div>
    </div>`;
  }).join('');
}

/** 禁言/解禁用户 */
async function toggleMute(uid) {
  const u = adminUsersCache.find(x => x.id === uid);
  const currentlyMuted = u ? u.muted : false;
  if (!confirm(`确认${currentlyMuted ? '解禁' : '禁言'}用户「${u ? u.username : ''}」？`)) return;
  try {
    await api('/api/admin/users/' + uid + '/mute', { method: 'PUT' });
    toast(currentlyMuted ? '已解禁' : '已禁言');
    loadAdminUsers();
  } catch (e) { toast(e.message); }
}

/** 删除用户 */
async function adminDeleteUser(uid) {
  const u = adminUsersCache.find(x => x.id === uid);
  if (!confirm(`确定删除用户「${u ? u.username : ''}」？\n其帖子、评论、点赞、签到将一并删除，且不可恢复。`)) return;
  try {
    await api('/api/admin/users/' + uid, { method: 'DELETE' });
    toast('用户已删除');
    loadAdminUsers();
    loadPosts();
  } catch (e) { toast(e.message); }
}

/** 授予管理员权限（仅超级管理员） */
async function grantAdmin(uid) {
  const u = adminUsersCache.find(x => x.id === uid);
  if (!confirm(`确认将「${u ? u.username : ''}」设为管理员？`)) return;
  try {
    await api('/api/superadmin/grant-admin/' + uid, { method: 'PUT' });
    toast('已设为管理员');
    loadAdminUsers();
  } catch (e) { toast(e.message); }
}

/** 撤销管理员权限（仅超级管理员） */
async function revokeAdmin(uid) {
  const u = adminUsersCache.find(x => x.id === uid);
  if (!confirm(`确认撤销「${u ? u.username : ''}」的管理员权限？`)) return;
  try {
    await api('/api/superadmin/revoke-admin/' + uid, { method: 'PUT' });
    toast('已撤销管理员');
    loadAdminUsers();
  } catch (e) { toast(e.message); }
}

/** 转让超级管理员（仅超级管理员） */
async function transferSuperAdmin(uid) {
  const u = adminUsersCache.find(x => x.id === uid);
  if (!confirm(`⚠️ 确认将超级管理员转让给「${u ? u.username : ''}」？\n\n转让后你将降为普通用户，此操作不可撤销！`)) return;
  if (!confirm('再次确认：真的要转让超级管理员吗？')) return;
  try {
    await api('/api/superadmin/transfer/' + uid, { method: 'PUT' });
    toast('超级管理员已转让');
    // 重新加载用户信息
    const { user } = await api('/api/me');
    state.user = user;
    renderAuth();
    hideAdminPanel();
  } catch (e) { toast(e.message); }
}

/** 置顶/取消置顶帖子 */
async function togglePinPost(pid, currentlyPinned) {
  try {
    await api('/api/posts/' + pid + '/pin', { method: 'PUT' });
    toast(currentlyPinned ? '已取消置顶' : '已置顶');
    loadPosts();
  } catch (e) { toast(e.message); }
}

/** 管理员删除帖子 */
async function adminDeletePost(pid) {
  if (!confirm('确定删除这篇帖子？')) return;
  try {
    await api('/api/posts/' + pid, { method: 'DELETE' });
    toast('帖子已删除');
    loadPosts();
  } catch (e) { toast(e.message); }
}

// ============================================================
// 页面初始化（恢复登录状态 → 自动签到 → 加载帖子）
// ============================================================
(async () => {
  try { const { user } = await api('/api/me'); state.user = user; } catch (e) {}
  renderAuth();
  await loadCheckin();
  await loadPosts();
})();
</script>
</body>
</html>
