<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MiForum">
<meta name="format-detection" content="telephone=no">
<title>积分商店 - MiForum</title>
<link rel="stylesheet" href="css/tailwind.css">
<style>
  *{font-family:system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif}
  body{background:#f0f2f5}
  .fade-in{animation:fadeIn .2s ease-out}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .toast-in{animation:slideUp .3s ease-out}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .item-card:hover{box-shadow:0 4px 24px rgba(0,0,0,.08);transform:translateY(-2px)}
  .item-card{transition:all .2s ease}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
  /* 移动端优化 */
  @media (max-width: 639px) {
    .item-card:hover{box-shadow:none;transform:none}
    .item-card:active{box-shadow:0 4px 24px rgba(0,0,0,.08);transform:scale(0.98)}
  }
  @media (hover: none) {
    .item-card:hover{box-shadow:none;transform:none}
    .item-card:active{box-shadow:0 4px 24px rgba(0,0,0,.08)}
  }
</style>
</head>
<body class="min-h-screen text-gray-800">

<!-- Topbar -->
<header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-200/60">
  <div class="max-w-7xl mx-auto flex items-center justify-between px-4 h-14">
    <div class="flex items-center gap-3">
      <a href="/" class="flex items-center gap-2 font-bold text-xl text-primary-600">
        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l4.93-1.36C8.42 21.5 10.15 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.61 0-3.14-.39-4.48-1.07l-.32-.17-2.93.81.81-2.93-.17-.32C4.39 15.14 4 13.61 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8z"/></svg>
        MiForum
      </a>
      <span class="text-sm text-gray-400">/ 积分商店</span>
    </div>
    <div id="authArea" class="flex items-center gap-2"></div>
  </div>
</header>

<div class="max-w-4xl mx-auto px-4 py-6 sm:py-8">
  <!-- 用户积分显示 -->
  <div class="bg-gradient-to-r from-primary-600 to-primary-700 rounded-2xl p-4 sm:p-6 mb-6 sm:mb-8 text-white">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold mb-1 sm:mb-2">积分商店</h1>
        <p class="text-sm sm:text-base text-primary-100">用积分兑换精美礼品和特权</p>
      </div>
      <div class="text-right">
        <p class="text-xs sm:text-sm text-primary-200">我的积分</p>
        <p id="userPoints" class="text-2xl sm:text-4xl font-bold">0</p>
      </div>
    </div>
  </div>

  <!-- 商品列表 -->
  <div class="mb-6 sm:mb-8">
    <h2 class="text-base sm:text-lg font-semibold mb-3 sm:mb-4">🎁 商品列表</h2>
    <div id="itemList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">
      <!-- 商品卡片将在这里动态生成 -->
    </div>
    <div id="emptyState" class="hidden text-center py-12">
      <svg class="w-16 h-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
      <p class="text-gray-400">暂无可兑换商品</p>
    </div>
  </div>

  <!-- 兑换记录 -->
  <div>
    <h2 class="text-base sm:text-lg font-semibold mb-3 sm:mb-4">📋 兑换记录</h2>
    <div id="orderList" class="space-y-3">
      <!-- 兑换记录将在这里动态生成 -->
    </div>
    <div id="emptyOrders" class="hidden text-center py-8">
      <svg class="w-12 h-12 mx-auto text-gray-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      <p class="text-sm text-gray-400">暂无兑换记录</p>
    </div>
  </div>
</div>

<!-- 兑换确认弹窗 -->
<div id="exchangeModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-6 fade-in">
    <div class="text-center mb-6">
      <div id="modalIcon" class="text-5xl mb-3">🎁</div>
      <h3 id="modalTitle" class="text-lg font-bold mb-1">确认兑换</h3>
      <p id="modalDesc" class="text-sm text-gray-500"></p>
    </div>
    <!-- 头像框预览 -->
    <div id="avatarPreview" class="hidden mb-4">
      <p class="text-xs text-gray-500 mb-2 text-center">预览效果</p>
      <div class="flex items-center justify-center gap-6">
        <div class="text-center">
          <div id="previewBefore" class="w-16 h-16 rounded-full bg-primary-100 flex items-center justify-center text-xl font-bold text-primary-700 mx-auto mb-1"></div>
          <p class="text-xs text-gray-400">当前</p>
        </div>
        <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
        <div class="text-center">
          <div id="previewAfter" class="w-16 h-16 rounded-full bg-primary-100 flex items-center justify-center text-xl font-bold text-primary-700 mx-auto mb-1"></div>
          <p class="text-xs text-gray-400">兑换后</p>
        </div>
      </div>
    </div>
    <!-- 称号预览 -->
    <div id="titlePreview" class="hidden mb-4">
      <p class="text-xs text-gray-500 mb-2 text-center">预览效果</p>
      <div class="flex items-center justify-center gap-2">
        <span class="text-sm font-medium text-gray-900">你的用户名</span>
        <span id="previewTitle" class="text-xs px-2 py-0.5 rounded bg-amber-100 text-amber-700"></span>
      </div>
    </div>
    <div class="bg-gray-50 rounded-xl p-4 mb-4">
      <div class="flex justify-between items-center">
        <span class="text-sm text-gray-600">商品价格</span>
        <span id="modalPrice" class="text-lg font-bold text-primary-600">100 积分</span>
      </div>
      <div class="flex justify-between items-center mt-2">
        <span class="text-sm text-gray-600">当前积分</span>
        <span id="modalCurrentPoints" class="text-sm font-medium">0</span>
      </div>
      <div class="flex justify-between items-center mt-2">
        <span class="text-sm text-gray-600">兑换后剩余</span>
        <span id="modalRemaining" class="text-sm font-medium">0</span>
      </div>
    </div>
    <div class="flex gap-3">
      <button onclick="hideExchangeModal()" class="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl text-sm font-medium hover:bg-gray-50 transition">取消</button>
      <button id="confirmExchangeBtn" onclick="confirmExchange()" class="flex-1 px-4 py-2.5 bg-primary-600 text-white rounded-xl text-sm font-medium hover:bg-primary-700 transition">确认兑换</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toastContainer" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] space-y-2"></div>

<script>
const API = '/api';
let state = { user: null, items: [], orders: [], selectedItemId: null };

// ============================================================
// API 请求封装
// ============================================================
async function api(url, opts = {}) {
  const res = await fetch(API + url, { 
    headers: { 'Content-Type': 'application/json' }, 
    credentials: 'include', 
    ...opts 
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

// ============================================================
// Toast 提示
// ============================================================
function toast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const colors = { 
    success: 'bg-green-500', 
    error: 'bg-red-500', 
    info: 'bg-gray-800' 
  };
  const el = document.createElement('div');
  el.className = `toast-in px-4 py-2.5 rounded-xl text-white text-sm shadow-lg ${colors[type]}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ============================================================
// 认证相关
// ============================================================
function renderAuth() {
  const area = document.getElementById('authArea');
  if (state.user) {
    area.innerHTML = `
      <span class="text-sm text-gray-600">${esc(state.user.username)}</span>
      <a href="/profile.html?id=${state.user.id}" class="px-3 py-1.5 text-sm border border-gray-200 rounded-xl hover:bg-gray-50 transition">个人中心</a>
      <button onclick="logout()" class="px-3 py-1.5 text-sm text-gray-500 hover:text-gray-700 transition">退出</button>
    `;
  } else {
    area.innerHTML = `
      <a href="/" class="px-3 py-1.5 text-sm border border-gray-200 rounded-xl hover:bg-gray-50 transition">返回首页</a>
    `;
  }
}

async function logout() {
  await api('/logout', { method: 'POST' });
  state.user = null;
  renderAuth();
  window.location.href = '/';
}

// ============================================================
// 加载商品列表
// ============================================================
async function loadItems() {
  try {
    const { items } = await api('/shop/items');
    state.items = items;
    renderItems();
  } catch (e) {
    console.error('加载商品失败:', e);
    toast('加载商品失败', 'error');
  }
}

function renderItems() {
  const list = document.getElementById('itemList');
  const empty = document.getElementById('emptyState');
  
  if (!state.items.length) {
    list.classList.add('hidden');
    empty.classList.remove('hidden');
    return;
  }
  
  list.classList.remove('hidden');
  empty.classList.add('hidden');
  
  list.innerHTML = state.items.map(item => `
    <div class="item-card bg-white rounded-xl border border-gray-100 p-4 sm:p-5 cursor-pointer" onclick="showExchangeModal(${item.id})">
      <div class="flex items-start justify-between mb-2 sm:mb-3">
        <span class="text-3xl sm:text-4xl">${item.icon}</span>
        ${item.stock >= 0 && item.stock <= 5 ? `<span class="text-xs px-2 py-1 bg-red-50 text-red-500 rounded-full">仅剩${item.stock}件</span>` : ''}
      </div>
      <h3 class="font-semibold text-gray-900 mb-1">${esc(item.name)}</h3>
      <p class="text-xs sm:text-sm text-gray-500 mb-3 sm:mb-4">${esc(item.description)}</p>
      <div class="flex items-center justify-between">
        <span class="text-base sm:text-lg font-bold text-primary-600">${item.price} 积分</span>
        <button class="px-3 py-1.5 bg-primary-600 text-white text-sm rounded-lg hover:bg-primary-700 transition">兑换</button>
      </div>
    </div>
  `).join('');
}

// ============================================================
// 加载兑换记录
// ============================================================
async function loadOrders() {
  try {
    const { orders } = await api('/shop/orders');
    state.orders = orders;
    renderOrders();
  } catch (e) {
    console.error('加载兑换记录失败:', e);
  }
}

function renderOrders() {
  const list = document.getElementById('orderList');
  const empty = document.getElementById('emptyOrders');
  
  if (!state.orders.length) {
    list.classList.add('hidden');
    empty.classList.remove('hidden');
    return;
  }
  
  list.classList.remove('hidden');
  empty.classList.add('hidden');
  
  list.innerHTML = state.orders.map(order => `
    <div class="bg-white rounded-xl border border-gray-100 p-3 sm:p-4 flex items-center justify-between">
      <div class="flex items-center gap-2 sm:gap-3">
        <span class="text-xl sm:text-2xl">${order.item_icon}</span>
        <div>
          <p class="text-sm sm:text-base font-medium text-gray-900">${esc(order.item_name)}</p>
          <p class="text-xs text-gray-400">${relTime(order.created_at)}</p>
        </div>
      </div>
      <div class="text-right">
        <p class="text-xs sm:text-sm font-medium text-red-500">-${order.price} 积分</p>
        <p class="text-xs text-green-500">${order.status === 'completed' ? '已完成' : '处理中'}</p>
      </div>
    </div>
  `).join('');
}

// ============================================================
// 兑换相关
// ============================================================
function showExchangeModal(itemId) {
  if (!state.user) {
    toast('请先登录', 'error');
    return;
  }
  
  const item = state.items.find(i => i.id === itemId);
  if (!item) return;
  
  state.selectedItemId = itemId;
  
  document.getElementById('modalIcon').textContent = item.icon;
  document.getElementById('modalTitle').textContent = `兑换 ${item.name}`;
  document.getElementById('modalDesc').textContent = item.description;
  document.getElementById('modalPrice').textContent = `${item.price} 积分`;
  document.getElementById('modalCurrentPoints').textContent = `${state.user.points || 0} 积分`;
  
  const remaining = (state.user.points || 0) - item.price;
  document.getElementById('modalRemaining').textContent = `${remaining} 积分`;
  document.getElementById('modalRemaining').className = remaining >= 0 ? 'text-sm font-medium text-green-600' : 'text-sm font-medium text-red-600';
  
  const btn = document.getElementById('confirmExchangeBtn');
  btn.disabled = remaining < 0;
  btn.className = remaining < 0 
    ? 'flex-1 px-4 py-2.5 bg-gray-300 text-gray-500 rounded-xl text-sm font-medium cursor-not-allowed'
    : 'flex-1 px-4 py-2.5 bg-primary-600 text-white rounded-xl text-sm font-medium hover:bg-primary-700 transition';

  // 隐藏所有预览
  document.getElementById('avatarPreview').classList.add('hidden');
  document.getElementById('titlePreview').classList.add('hidden');

  // 头像框预览
  if (item.type === 'avatar_frame' && item.value !== 'none') {
    const frameStyles = {
      gold: 'box-shadow: 0 0 0 3px #fbbf24, 0 0 8px #fbbf2440',
      silver: 'border: 3px solid #94a3b8',
      blue: 'box-shadow: 0 0 0 3px #3b82f6, 0 0 8px #3b82f640',
      purple: 'box-shadow: 0 0 0 3px #a855f7, 0 0 12px #a855f740'
    };
    const style = frameStyles[item.value] || '';
    const letter = state.user.username ? state.user.username[0].toUpperCase() : '?';
    const avatarHtml = state.user.avatar_url
      ? `<img src="${state.user.avatar_url}" class="w-full h-full object-cover rounded-full">`
      : letter;
    document.getElementById('previewBefore').innerHTML = avatarHtml;
    document.getElementById('previewBefore').className = state.user.avatar_url
      ? 'w-16 h-16 rounded-full overflow-hidden mx-auto mb-1'
      : 'w-16 h-16 rounded-full bg-primary-100 flex items-center justify-center text-xl font-bold text-primary-700 mx-auto mb-1';
    document.getElementById('previewAfter').innerHTML = avatarHtml;
    document.getElementById('previewAfter').className = state.user.avatar_url
      ? `w-16 h-16 rounded-full overflow-hidden mx-auto mb-1`
      : `w-16 h-16 rounded-full bg-primary-100 flex items-center justify-center text-xl font-bold text-primary-700 mx-auto mb-1`;
    document.getElementById('previewAfter').style = style;
    document.getElementById('avatarPreview').classList.remove('hidden');
  }

  // 称号预览
  if (item.type === 'title') {
    document.getElementById('previewTitle').textContent = item.value;
    document.getElementById('titlePreview').classList.remove('hidden');
  }

  document.getElementById('exchangeModal').classList.remove('hidden');
  document.getElementById('exchangeModal').classList.add('flex');
}

function hideExchangeModal() {
  document.getElementById('exchangeModal').classList.add('hidden');
  document.getElementById('exchangeModal').classList.remove('flex');
  state.selectedItemId = null;
}

async function confirmExchange() {
  if (!state.selectedItemId) return;

  const btn = document.getElementById('confirmExchangeBtn');
  btn.disabled = true;
  btn.textContent = '兑换中...';

  try {
    const result = await api('/shop/exchange', {
      method: 'POST',
      body: JSON.stringify({ itemId: state.selectedItemId })
    });

    toast(result.message, 'success');
    state.user.points = result.points;
    document.getElementById('userPoints').textContent = state.user.points;

    // 同步改名卡次数
    if (result.rename_chances !== undefined) state.user.rename_chances = result.rename_chances;

    // 兑换成功提示
    const exchanged = state.items.find(i => i.id === state.selectedItemId);
    if (exchanged && exchanged.type === 'rename_card') {
      toast(`当前改名卡：${result.rename_chances} 张`, 'info');
    } else if (exchanged && exchanged.type === 'title') {
      toast(`称号已更换为「${exchanged.value}」`, 'success');
    } else if (exchanged && exchanged.type === 'avatar_frame') {
      toast(`头像框已${exchanged.value === 'none' ? '移除' : '更换'}`, 'success');
    }

    hideExchangeModal();
    await loadOrders();
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '确认兑换';
  }
}

// ============================================================
// 工具函数
// ============================================================
function esc(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
}

function relTime(dateStr) {
  if (!dateStr) return '';
  const now = new Date();
  const date = new Date(dateStr);
  const diff = now - date;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + ' 分钟前';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + ' 小时前';
  const days = Math.floor(hours / 24);
  if (days < 30) return days + ' 天前';
  return date.toLocaleDateString('zh-CN');
}

// ============================================================
// 初始化
// ============================================================
(async () => {
  try {
    const { user } = await api('/me');
    state.user = user;
    if (state.user) {
      document.getElementById('userPoints').textContent = state.user.points || 0;
    }
  } catch (e) {}
  renderAuth();
  await loadItems();
  await loadOrders();
})();
</script>
</body>
</html>
